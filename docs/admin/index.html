<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>CardYeung · Admin</title>
<style>
:root{--ink:#131313;--mute:#8c8c93;--bg:#f6f6f7;--line:#e9e9ec;--mint:#cfe5df;--bar:#2f6b5a;--lav:#ead9f4;--peach:#fbe2bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.45 Urbanist,"DM Sans",system-ui,sans-serif}
button,input{font:inherit}main{max-width:1100px;margin:auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:30px;letter-spacing:-1px;margin:0;font-weight:600}h1 i{font-style:normal;color:#c4c4c9}
.btn{height:44px;border-radius:22px;border:0;background:var(--ink);color:#fff;padding:0 22px;font-weight:700;cursor:pointer}.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.login{max-width:360px;margin:15vh auto;background:#fff;border-radius:30px;padding:28px;box-shadow:0 20px 50px -30px #0004}.login h1{margin-bottom:6px}.login p{color:var(--mute);margin:0 0 18px}
.login input{width:100%;height:52px;border-radius:18px;border:1.5px solid var(--line);padding:0 16px;margin-bottom:12px}.err{color:#b3261e;min-height:22px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.kpi{border-radius:26px;padding:18px 20px;background:#fff}.kpi.mint{background:var(--mint)}.kpi.lav{background:var(--lav)}.kpi.peach{background:var(--peach)}
.kpi small{display:block;color:#5a5a62;font-weight:600}.kpi b{display:block;font-size:42px;letter-spacing:-2px;line-height:1.15;font-weight:600}.kpi span{font-size:13px;color:#5a5a62}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:760px){.row{grid-template-columns:1fr}}
.card{background:#fff;border-radius:26px;padding:20px}.card h2{font-size:18px;margin:0 0 4px;font-weight:600}.card p{margin:0 0 10px;color:var(--mute);font-size:13px}
svg{width:100%;height:auto;display:block}.axis{fill:var(--mute);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}.num{text-align:right;font-variant-numeric:tabular-nums}.wrap{overflow-x:auto}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tab{height:38px;border-radius:19px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-weight:700;cursor:pointer}.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:10px;margin-bottom:14px}.bar input,.bar select,textarea,.f input,.f select{height:44px;border-radius:16px;border:1.5px solid var(--line);padding:0 14px;background:#fff;min-width:0}.bar input{flex:1}textarea{width:100%;height:140px;padding:12px 14px;resize:vertical}
.sm{height:32px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-weight:700;cursor:pointer;font-size:13px}.sm.red{color:#b3261e;border-color:#f0c9c6}.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:var(--peach)}.pill.red{background:#f6d4d1;color:#b3261e}
.acts{display:flex;gap:6px;flex-wrap:wrap}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}.ok{color:#2f6b5a;min-height:22px;font-size:14px}code{font-size:12px;background:var(--bg);padding:1px 6px;border-radius:6px}
.foot{color:var(--mute);font-size:12px;margin-top:16px}
</style></head><body><main id="app"></main>
<script>
const $=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),nf=new Intl.NumberFormat();
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
function login(msg=''){$.innerHTML='<form class="login"><h1>Admin <i>portal</i></h1><p>CardYeung usage overview.</p><input type="password" name="p" placeholder="Admin password" autocomplete="current-password" required autofocus><div class="err">'+esc(msg)+'</div><button class="btn" style="width:100%">Sign in</button></form>';
 $.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/admin/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:e.target.p.value})});r.ok?load():login((await r.json()).error)}}
function bars(data,label){const W=520,H=150,max=Math.max(1,...data.map(x=>x.n)),bw=W/data.length;
 return '<svg viewBox="0 0 '+W+' '+(H+18)+'" role="img" aria-label="'+label+'">'+data.map((x,i)=>{const h=x.n/max*(H-8);return '<rect x="'+(i*bw+1.5)+'" y="'+(H-h)+'" width="'+(bw-3)+'" height="'+Math.max(h,x.n?2:1)+'" rx="2" fill="'+(x.n?'var(--bar)':'#dfe7e4')+'"><title>'+x.d+': '+x.n+'</title></rect>'}).join('')+'<text class="axis" x="0" y="'+(H+14)+'">'+data[0].d.slice(5)+'</text><text class="axis" x="'+W+'" y="'+(H+14)+'" text-anchor="end">'+data.at(-1).d.slice(5)+'</text><text class="axis" x="'+W+'" y="9" text-anchor="end">max '+max+'</text></svg>'}
const kpi=(t,v,s,c='')=>'<div class="kpi '+c+'"><small>'+t+'</small><b>'+nf.format(v)+'</b><span>'+s+'</span></div>';
const api=async(path,body)=>{const r=await fetch('/admin/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(r.status===401){login();throw Error('auth')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed.');return d};
const when=t=>new Date(t).toLocaleString();let tab='overview',msg='';
function shell(inner){$.innerHTML='<header><h1>Admin <i>portal</i></h1><button class="btn line" id="re">Refresh</button></header><div class="tabs">'+[['overview','Overview'],['users','Users'],['shops','Shops'],['broadcast','Broadcast'],['log','Audit log']].map(([k,l])=>'<button class="tab'+(tab===k?' on':'')+'" data-tab="'+k+'">'+l+'</button>').join('')+'</div>'+inner;
 $.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;msg='';load()});document.getElementById('re').onclick=()=>load()}
const run=async(body,confirmText)=>{if(confirmText&&!confirm(confirmText))return;try{const d=await api('do',body);msg=d.queued!==undefined?'Queued for '+d.queued+' people.':'Done.'}catch(e){if(e.message==='auth')return;msg=e.message}await load(true)};
function overview(d){const u=d.users;shell('<div class="kpis">'+kpi('Total users',u.total,'+'+u.new1+' today · +'+u.new7+' this week · +'+u.new30+' this month','mint')+kpi('Active (7 days)',u.active7,nf.format(u.active1)+' today · '+nf.format(u.active30)+' in 30 days','lav')+kpi('Shop owners',d.shops.owners,nf.format(d.shops.programs)+' programs','peach')+kpi('Cards in wallets',d.cards.program+d.cards.manual,nf.format(d.cards.manual)+' saved memberships')+kpi('Stamps given',d.cards.stampEvents,nf.format(d.cards.redemptions)+' rewards redeemed')+kpi('Recovery set up',u.withRecovery,nf.format(u.recovered)+' accounts recovered')+'</div>'+
 '<div class="row"><div class="card"><h2>New users</h2><p>Last 30 days</p>'+bars(d.signups,'New users per day')+'</div><div class="card"><h2>Stamps given</h2><p>Last 30 days</p>'+bars(d.stamps,'Stamps per day')+'</div></div>'+
 '<div class="row"><div class="card wrap"><h2>Newest users</h2><p>Open the Users tab to manage them.</p><table><tr><th>Account</th><th>Telegram</th><th>Joined</th><th>Last seen</th><th class="num">Cards</th><th class="num">Shops</th></tr>'+d.recent.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.tg)+'</td><td>'+ago(x.created)+'</td><td>'+ago(x.seen)+'</td><td class="num">'+x.cards+'</td><td class="num">'+x.shops+'</td></tr>').join('')+'</table></div><div class="card wrap"><h2>Top programs</h2><p>By members</p><table><tr><th>Program</th><th>Category</th><th class="num">Members</th></tr>'+(d.top.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.category)+'</td><td class="num">'+x.members+'</td></tr>').join('')||'<tr><td colspan="3">No programs yet.</td></tr>')+'</table></div></div><p class="foot">Updated '+new Date().toLocaleTimeString()+'</p>')}
let q={users:'',shops:''};
function searchBar(kind){return '<form class="bar" id="sf"><input name="q" placeholder="'+(kind==='users'?'Search by Telegram ID or account code':'Search by name, code or owner ID')+'" value="'+esc(q[kind])+'"><button class="btn">Search</button></form>'}
function wireSearch(kind){document.getElementById('sf').onsubmit=e=>{e.preventDefault();q[kind]=e.target.q.value;load()}}
async function users(){const list=await api('users?q='+encodeURIComponent(q.users));
 shell(searchBar('users')+'<div class="ok">'+esc(msg)+'</div><div class="card wrap"><table><tr><th>Telegram ID</th><th>Account</th><th>Last seen</th><th class="num">Cards</th><th class="num">Shops</th><th></th></tr>'+(list.map(x=>'<tr><td>'+esc(x.id)+(x.banned?' <span class="pill red">suspended</span>':'')+'</td><td>'+esc(x.pub)+'</td><td>'+ago(x.seen)+'</td><td class="num">'+x.cards+'</td><td class="num">'+x.shops+'</td><td><button class="sm" data-open="'+esc(x.id)+'">Manage</button></td></tr>').join('')||'<tr><td colspan="6">No users found.</td></tr>')+'</table></div><div id="detail"></div>');
 wireSearch('users');$.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open))}
async function detail(id){const d=await api('user?id='+encodeURIComponent(id)),u=d.user,box=document.getElementById('detail');
 box.innerHTML='<div class="card wrap" style="margin-top:14px"><h2>User '+esc(u.id)+(u.admin?' <span class="pill">admin</span>':'')+(u.banned?' <span class="pill red">suspended</span>':'')+'</h2><p>Account '+esc(u.pub)+' · joined '+esc(when(u.created))+' · last seen '+ago(u.seen)+' · recovery '+(u.recovery?'set':'not set')+' · '+(d.pref?(d.pref.lang==='en'?'English':'Khmer')+(d.pref.muted?' · muted':''):'no language saved')+'</p><div class="acts">'+
 (u.admin?'':'<button class="sm" data-do=\'{"op":"'+(u.banned?'unban':'ban')+'","id":"'+esc(u.id)+'"}\'>'+(u.banned?'Reinstate':'Suspend')+'</button><button class="sm red" data-do=\'{"op":"deleteUser","id":"'+esc(u.id)+'"}\' data-ask="Delete this user and ALL their cards, programs and history? This cannot be undone.">Delete user</button>')+
 (u.recovery?'<button class="sm" data-do=\'{"op":"clearRecovery","id":"'+esc(u.id)+'"}\' data-ask="Remove their recovery code?">Clear recovery</button>':'')+'<button class="sm" id="dm">Send message</button></div>'+
 '<h2 style="margin-top:18px">Cards</h2><table><tr><th>Card</th><th>Member code</th><th class="num">Stamps</th><th></th></tr>'+(d.cards.map(c=>'<tr><td>'+esc(c.name||'Card')+'</td><td><code>'+esc(c.member)+'</code></td><td class="num">'+(c.code?esc(c.stamps)+'/'+esc(c.target):esc(c.number||''))+'</td><td><div class="acts">'+(c.code?'<button class="sm" data-stamp="'+esc(c.member)+'" data-max="'+esc(c.target)+'" data-cur="'+esc(c.stamps)+'">Set stamps</button>':'')+'<button class="sm red" data-do=\'{"op":"deleteCard","member":"'+esc(c.member)+'"}\' data-ask="Delete this card?">Delete</button></div></td></tr>').join('')||'<tr><td colspan="4">No cards.</td></tr>')+'</table>'+
 '<h2 style="margin-top:18px">Programs owned</h2><table><tr><th>Name</th><th>Code</th><th class="num">Members</th></tr>'+(d.shops.map(x=>'<tr><td>'+esc(x.name)+'</td><td><code>'+esc(x.code)+'</code></td><td class="num">'+x.members+'</td></tr>').join('')||'<tr><td colspan="3">None.</td></tr>')+'</table>'+
 '<h2 style="margin-top:18px">Recent activity</h2><table>'+(d.events.map(e=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.label)+'</td><td class="num">'+ago(e.at)+'</td></tr>').join('')||'<tr><td>No activity.</td></tr>')+'</table></div>';
 wireActions(box,u.id);box.scrollIntoView({behavior:'smooth'})}
function wireActions(root,uid){root.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>run(JSON.parse(b.dataset.do),b.dataset.ask));
 root.querySelectorAll('[data-stamp]').forEach(b=>b.onclick=()=>{const v=prompt('Set stamps (0 to '+b.dataset.max+')',b.dataset.cur);if(v!==null)run({op:'setStamps',member:b.dataset.stamp,stamps:Number(v)})});
 const dm=root.querySelector('#dm');if(dm)dm.onclick=()=>{const t=prompt('Message to send via the bot');if(t)run({op:'message',id:uid,text:t})}}
async function shops(){const list=await api('shops?q='+encodeURIComponent(q.shops));
 shell(searchBar('shops')+'<div class="ok">'+esc(msg)+'</div><div class="card wrap"><table><tr><th>Program</th><th>Code</th><th>Owner</th><th>Category</th><th class="num">Stamps</th><th>Reward</th><th class="num">Members</th><th></th></tr>'+(list.map(x=>'<tr><td>'+esc(x.name)+'</td><td><code>'+esc(x.code)+'</code></td><td>'+esc(x.owner)+'</td><td>'+esc(x.category)+'</td><td class="num">'+x.target+'</td><td>'+esc(x.reward)+'</td><td class="num">'+x.members+'</td><td><div class="acts"><button class="sm" data-edit="'+esc(x.code)+'" data-name="'+esc(x.name)+'" data-target="'+x.target+'" data-reward="'+esc(x.reward)+'">Edit</button><button class="sm red" data-do=\'{"op":"deleteShop","code":"'+esc(x.code)+'"}\' data-ask="Delete this program and every member card in it?">Delete</button></div></td></tr>').join('')||'<tr><td colspan="8">No programs found.</td></tr>')+'</table></div>');
 wireSearch('shops');wireActions($,'');$.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const name=prompt('Program name',b.dataset.name);if(name===null)return;const target=prompt('Stamps needed (2 to 50)',b.dataset.target);if(target===null)return;const reward=prompt('Reward',b.dataset.reward);if(reward===null)return;run({op:'editShop',code:b.dataset.edit,name,target:Number(target),reward})})}
function broadcast(){shell('<div class="card"><h2>Broadcast</h2><p>Sent through the bot. People who muted notifications and suspended users are skipped.</p><form id="bf"><div class="f"><select name="audience"><option value="all">Everyone</option><option value="owners">Shop owners only</option></select></div><textarea name="text" maxlength="3500" placeholder="Write your message…" required></textarea><div class="ok">'+esc(msg)+'</div><button class="btn">Send broadcast</button></form></div>');
 document.getElementById('bf').onsubmit=e=>{e.preventDefault();run({op:'broadcast',audience:e.target.audience.value,text:e.target.text.value},'Send this message now? It cannot be recalled.')}}
async function logs(){const l=await api('log');shell('<div class="card wrap"><h2>Audit log</h2><p>Last 100 admin actions.</p><table><tr><th>When</th><th>Action</th><th>Target</th><th>Detail</th></tr>'+(l.map(x=>'<tr><td>'+esc(when(x.at))+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.target)+'</td><td>'+esc(x.detail)+'</td></tr>').join('')||'<tr><td colspan="4">Nothing yet.</td></tr>')+'</table></div>')}
async function load(){try{if(tab==='overview')overview(await api('stats'));else if(tab==='users')await users();else if(tab==='shops')await shops();else if(tab==='broadcast')broadcast();else await logs()}catch(e){if(e.message!=='auth')login(e.message)}}
// Inside Telegram, admins listed in ADMIN_IDS sign in automatically.
(async()=>{const tg=window.Telegram?.WebApp;if(tg?.initData){try{const r=await fetch('/admin/api/telegram',{method:'POST',headers:{Authorization:'tma '+tg.initData}});if(r.ok){tg.ready?.();tg.expand?.()}}catch{}}load()})();
</script></body></html>
